# Builds docs/Ali_Can_Keskin_Resume.pdf from docs/resume.tex and commits it.
name: Build resume
on:
  push:
    branches: [main]
    paths: [docs/resume.tex]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          working_directory: docs
      - name: Commit PDF
        run: |
          mv docs/resume.pdf docs/Ali_Can_Keskin_Resume.pdf
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add docs/Ali_Can_Keskin_Resume.pdf
          git diff --cached --quiet || (git commit -m "Build resume PDF" && git push)
